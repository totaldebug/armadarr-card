name: Bug Report
description: Report a bug to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Version
      placeholder: e.g. 2024.3.0
    validations:
      required: true
  - type: input
    id: card-version
    attributes:
      label: Card Version
      placeholder: e.g. v0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Errors
      description: Please provide any relevant logs or browser console errors.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
